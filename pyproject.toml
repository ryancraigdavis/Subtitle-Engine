[project]
name = "subgen"
version = "0.1.0"
authors = [
    { name = "Ryan Davis", email = "ryancraigdavis@gmail.com" },
]
description = "Local AI subtitle generation using faster-whisper and NLLB-200"
readme = "README.md"
requires-python = ">=3.12"

keywords = [
    "subtitles",
    "whisper",
    "transcription",
    "translation",
    "nllb",
    "faster-whisper",
    "srt",
    "video",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing",
]

license = "MIT"
dependencies = [
    "faster-whisper>=1.0.0",
    "pysrt>=1.1.2",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
translate = [
    "ctranslate2>=4.0.0",
    "transformers>=4.40.0",
]
tamil = [
    "IndicTransToolkit",
    "transformers>=4.51.0",
    "torch>=2.0.0",
]

[project.scripts]
subgen = "generate_subtitles:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["generate_subtitles.py"]

[tool.uv]
dev-dependencies = []
